# Replace these three values with your own
site_name: Acme Docs (POC)
site_url: https://YOURUSERNAME.github.io/YOURREPO/
repo_url: https://github.com/YOURUSERNAME/YOURREPO

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.action.edit
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition          # !!! note / !!! warning callout boxes
  - toc:
      permalink: true
  - pymdownx.superfences  # better code blocks
  - attr_list

# Pages not listed here still build; this just controls the sidebar order.
# You can delete this whole block to let MkDocs auto-generate navigation,
# which is easier when non-technical users are creating new pages.
